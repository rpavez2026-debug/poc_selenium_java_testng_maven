# Valores por defecto. Cualquier clave se puede sobreescribir con -Dclave=valor
# Ej: mvn test -Dbrowser=firefox -Dheadless=true
base.url=https://www.saucedemo.com/
browser=chrome
headless=false
explicit.wait.seconds=10

# Reintentos automáticos de un test fallido (0 = sin reintento)
retry.max=1

# Los datos de prueba de cada CP (usuario, password, mensajes esperados) están en utils.json
