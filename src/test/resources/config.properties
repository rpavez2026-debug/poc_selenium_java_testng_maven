# Valores por defecto. Cualquier clave se puede sobreescribir con -Dclave=valor
# Ej: mvn test -Dbrowser=firefox -Dheadless=true

# Ambiente de ejecución: DEV, TEST o PROD (cualquier otro valor da error). Ej: mvn test -Dambiente=TEST
# saucedemo.com solo tiene un sitio público, por eso PROD por defecto y las tres URL iguales.
ambiente=PROD
base.url.dev=https://www.saucedemo.com/
base.url.test=https://www.saucedemo.com/
base.url.prod=https://www.saucedemo.com/
browser=chrome
headless=false
explicit.wait.seconds=10

# Reintentos automáticos de un test fallido (0 = sin reintento)
retry.max=1

# Los datos de prueba de cada CP (usuario, password, mensajes esperados) están en utils.json
