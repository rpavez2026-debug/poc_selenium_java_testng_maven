status = error
name = SauceDemoLog4j2Config

property.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] - %msg%n
property.logDir = logs

# Consola
appender.console.type = Console
appender.console.name = StdoutAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# Archivo: logs/test-automation.log; rota cada día o al pasar 10MB,
# los antiguos quedan en logs/archivo/ (máximo 20 por día)
appender.rolling.type = RollingFile
appender.rolling.name = RollingAppender
appender.rolling.fileName = ${logDir}/test-automation.log
appender.rolling.filePattern = ${logDir}/archivo/test-automation-%d{yyyy-MM-dd}-%i.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${pattern}
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 20

rootLogger.level = info
rootLogger.appenderRef.console.ref = StdoutAppender
rootLogger.appenderRef.rolling.ref = RollingAppender
