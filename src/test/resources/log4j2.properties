status = error
name = SauceDemoLog4j2Config

# Solo consola. El archivo logs/<AMBIENTE>/<aaaa>/<mm>/<dd>/test-automation.log lo agrega Log.java por código,
# después de validar el ambiente: si estuviera aquí, una librería que inicialice log4j2 antes podría crear
# la carpeta con el valor sin validar (p. ej. "dev" en vez de "DEV").
# ${sys:log.ambiente} lo fija Log.java; ese mismo patrón se usa para el archivo.
appender.console.type = Console
appender.console.name = StdoutAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{dd-MM-yyyy HH:mm:ss.SSS} | ${sys:log.ambiente:-?} | %-5level | [%t] %msg%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = StdoutAppender
